services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcdance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bcdance}
      POSTGRES_DB: ${POSTGRES_DB:-bcdance_manager}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bcdance} -d ${POSTGRES_DB:-bcdance_manager}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${APP_PORT:-5174}:5174'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5174
      ORIGIN: ${BETTER_AUTH_URL:-http://localhost:5174}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcdance}:${POSTGRES_PASSWORD:-bcdance}@db:5432/${POSTGRES_DB:-bcdance_manager}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bcdance.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
