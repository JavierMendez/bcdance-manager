services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcdance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bcdance}
      POSTGRES_DB: ${POSTGRES_DB:-bcdance_manager}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bcdance} -d ${POSTGRES_DB:-bcdance_manager}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-5173}:5173'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcdance}:${POSTGRES_PASSWORD:-bcdance}@db:5432/${POSTGRES_DB:-bcdance_manager}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
