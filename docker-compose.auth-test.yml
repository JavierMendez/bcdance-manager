services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: dashboard_auth_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U auth_test -d dashboard_auth_test]
      interval: 2s
      timeout: 5s
      retries: 30
  auth-tests:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    init: true
    working_dir: /app
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://auth_test:isolated-test-password@auth-db:5432/dashboard_auth_test
      BETTER_AUTH_SECRET: isolated-dashboard-auth-test-secret-at-least-32
      BETTER_AUTH_URL: http://localhost:5173
      ORIGIN: http://localhost:5173
    volumes:
      - .:/app
      - auth_node_modules:/app/node_modules
      - auth_svelte_kit:/app/.svelte-kit
    command: [sh, -c, 'npx --yes pnpm@9.15.9 install --frozen-lockfile && npx --yes pnpm@9.15.9 db:migrate && node tests/http/dashboard-authorization.mjs']
volumes:
  auth_node_modules:
  auth_svelte_kit:
