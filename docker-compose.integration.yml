services:
  balance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: balance_test
      POSTGRES_PASSWORD: balance_test_only
      POSTGRES_DB: attendance_balance_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U balance_test -d attendance_balance_test]
      interval: 1s
      timeout: 3s
      retries: 30
  integration-tests:
    image: node:22-bookworm-slim
    init: true
    working_dir: /app
    environment:
      ATTENDANCE_INTEGRATION_DATABASE_URL: postgres://balance_test:balance_test_only@balance-db:5432/attendance_balance_test
    depends_on:
      balance-db:
        condition: service_healthy
    volumes:
      - .:/app
      - integration_node_modules:/app/node_modules
      - integration_svelte_kit:/app/.svelte-kit
    command:
      - sh
      - -c
      - npx --yes pnpm@9.15.9 install --frozen-lockfile && npx --yes pnpm@9.15.9 exec vitest run --config vitest.integration.config.ts
volumes:
  integration_node_modules:
  integration_svelte_kit:
